<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>30天身体状态重置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 顶部 -->
  <header id="app-header">
    <div class="app-title">30 DAY RESET</div>
    <div class="header-day" id="header-day-label"></div>
  </header>

  <!-- 主内容区 -->
  <main id="main-content">
    <div style="text-align:center;padding:60px 20px;color:#9ca3af">加载中...</div>
  </main>

  <!-- 底部导航 -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="today">
      <span class="nav-icon">🏠</span>今日
    </button>
    <button class="nav-btn" data-view="exercise">
      <span class="nav-icon">💪</span>训练
    </button>
    <button class="nav-btn" data-view="trends">
      <span class="nav-icon">📈</span>趋势
    </button>
    <button class="nav-btn" data-view="export">
      <span class="nav-icon">📤</span>导出
    </button>
  </nav>

  <!-- 遮罩层 -->
  <div id="modal-overlay" class="hidden"></div>

  <!-- 早晨记录 Modal -->
  <div id="modal-morning" class="modal hidden">
    <div class="modal-drag"></div>
    <div id="morning-content"></div>
  </div>

  <!-- 未完成原因 Modal -->
  <div id="modal-reason" class="modal hidden" data-task-id="">
    <div class="modal-drag"></div>
    <div class="modal-title" id="modal-reason-title">未完成原因</div>
    <p style="font-size:13px;color:#6b7280;margin-bottom:12px">选择或填写未完成原因，帮助AI更好地分析和调整计划</p>
    <div class="reason-grid" id="reason-grid">
      <button class="reason-btn" data-reason="加班">加班</button>
      <button class="reason-btn" data-reason="太累">太累</button>
      <button class="reason-btn" data-reason="生病/不舒服">生病/不舒服</button>
      <button class="reason-btn" data-reason="下雨">下雨</button>
      <button class="reason-btn" data-reason="游戏时间过长">游戏时间过长</button>
      <button class="reason-btn" data-reason="临时有事">临时有事</button>
      <button class="reason-btn" data-reason="忘记了">忘记了</button>
      <button class="reason-btn" data-reason="懒得做">懒得做</button>
    </div>
    <input type="text" id="reason-custom" placeholder="自定义原因（可选）">
    <div class="reason-btns-row">
      <button class="btn btn-outline btn-sm" id="btn-cancel-task" style="flex:1">恢复未选择</button>
      <button class="btn btn-primary btn-sm" id="btn-confirm-reason" style="flex:2">确认未完成</button>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast"></div>

</div>

<script src="plan.js"></script>
<script src="db.js"></script>
<script src="charts.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
<script>
  // 更新 header 天数
  function updateHeaderDay() {
    const el = document.getElementById("header-day-label");
    if (el) {
      const day = currentDay();
      el.textContent = `Day ${day} / ${PLAN.TOTAL_DAYS}`;
    }
  }
  window.addEventListener("DOMContentLoaded", updateHeaderDay);
</script>
</body>
</html>
